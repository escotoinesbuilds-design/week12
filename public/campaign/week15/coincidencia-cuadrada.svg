<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title description">
  <title id="title">Ejemplo ficticio de coincidencia con filtros</title>
  <desc id="description">Un perfil de demostración coincide con criterios ficticios de presupuesto, distancia, horario y especialidad. No es una recomendación ni un perfil real.</desc>
  <rect width="1080" height="1080" fill="#f3f6f9"/>
  <rect x="54" y="54" width="972" height="972" rx="40" fill="#ffffff" stroke="#d3dee8" stroke-width="3"/>
  <rect x="88" y="88" width="372" height="52" rx="26" fill="#805c0a"/>
  <text x="274" y="123" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="1">EJEMPLO FICTICIO</text>
  <text x="88" y="216" fill="#066863" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="2">QUÉ SIGNIFICA LA COINCIDENCIA</text>
  <text x="88" y="300" fill="#1b2f49" font-family="Arial, sans-serif" font-size="62" font-weight="700">Coincide con tus</text>
  <text x="88" y="370" fill="#1b2f49" font-family="Arial, sans-serif" font-size="62" font-weight="700">filtros. Nada más.</text>
  <text x="88" y="421" fill="#52657b" font-family="Arial, sans-serif" font-size="28">Una coincidencia no es una recomendación médica.</text>
  <rect x="88" y="474" width="904" height="337" rx="24" fill="#f9fbfd" stroke="#d3dee8" stroke-width="2"/>
  <rect x="120" y="507" width="253" height="43" rx="21" fill="#fff3d4"/>
  <text x="247" y="536" fill="#805c0a" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">PERFIL SIMULADO</text>
  <text x="120" y="600" fill="#1b2f49" font-family="Arial, sans-serif" font-size="36" font-weight="700">Perfil ficticio A</text>
  <text x="120" y="659" fill="#52657b" font-family="Arial, sans-serif" font-size="27">Especialidad de ejemplo: medicina general</text>
  <text x="120" y="710" fill="#52657b" font-family="Arial, sans-serif" font-size="27">Precio: $950 MXN · Distancia: 4 km · Tarde</text>
  <rect x="120" y="744" width="405" height="47" rx="23" fill="#075e59"/>
  <text x="322" y="776" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">COINCIDE CON ESTOS FILTROS</text>
  <text x="88" y="870" fill="#1b2f49" font-family="Arial, sans-serif" font-size="27" font-weight="700">Los datos son inventados para esta demostración.</text>
  <text x="88" y="917" fill="#52657b" font-family="Arial, sans-serif" font-size="25">No indica calidad, credenciales ni disponibilidad real.</text>
  <text x="88" y="974" fill="#066863" font-family="Arial, sans-serif" font-size="24" font-weight="700">RutaSalud · rutasalud-w12.vercel.app/launch</text>
</svg>
