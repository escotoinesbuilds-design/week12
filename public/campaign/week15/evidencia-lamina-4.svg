<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title description">
  <title id="title">Carrusel: qué hacer con información incierta, lámina 4</title>
  <desc id="description">La información de ejemplo no confirma una tarifa ni disponibilidad; pregunta directamente antes de decidir.</desc>
  <rect width="1080" height="1080" fill="#f3f6f9"/>
  <rect x="54" y="54" width="972" height="972" rx="40" fill="#ffffff" stroke="#d3dee8" stroke-width="3"/>
  <rect x="88" y="88" width="372" height="52" rx="26" fill="#805c0a"/>
  <text x="274" y="123" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="1">EJEMPLO FICTICIO</text>
  <text x="88" y="216" fill="#066863" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="2">QUÉ ESTÁ CONFIRMADO · 4/4</text>
  <text x="88" y="322" fill="#1b2f49" font-family="Arial, sans-serif" font-size="61" font-weight="700">¿Qué puedes hacer?</text>
  <rect x="88" y="388" width="904" height="148" rx="20" fill="#edf6f5"/>
  <text x="128" y="448" fill="#1b2f49" font-family="Arial, sans-serif" font-size="29" font-weight="700">1. Revisa la etiqueta y la fecha.</text>
  <text x="128" y="493" fill="#52657b" font-family="Arial, sans-serif" font-size="24">No trates una cifra simulada como una cotización.</text>
  <rect x="88" y="557" width="904" height="148" rx="20" fill="#edf6f5"/>
  <text x="128" y="617" fill="#1b2f49" font-family="Arial, sans-serif" font-size="29" font-weight="700">2. Pregunta directamente si lo necesitas.</text>
  <text x="128" y="662" fill="#52657b" font-family="Arial, sans-serif" font-size="24">Confirma precio y horario antes de confiar en ellos.</text>
  <rect x="88" y="726" width="904" height="107" rx="20" fill="#fff8e6"/>
  <text x="128" y="791" fill="#604d21" font-family="Arial, sans-serif" font-size="26" font-weight="700">Ver una opción no confirma una cita.</text>
  <text x="88" y="900" fill="#1b2f49" font-family="Arial, sans-serif" font-size="27" font-weight="700">Tú decides qué hacer después.</text>
  <text x="88" y="974" fill="#066863" font-family="Arial, sans-serif" font-size="24" font-weight="700">RutaSalud · rutasalud-w12.vercel.app/launch</text>
</svg>
